name: KIS morning market briefing

on:
  schedule:
    - cron: '17 15 * * *' # 00:17 Asia/Seoul; allow for observed scheduler delays before 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bankis-morning-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      BANKIS_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Mark current execution
        run: python -m bankis_scout.cloud_delivery running
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/cloud_state
            data/forward_validation
          key: bankis-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bankis-ledger-
      - name: Restore previous evidence and ledger
        run: python -m bankis_scout.cloud_delivery restore
      - name: Verify required sandbox configuration
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python -c "import os; assert os.getenv('KIS_APP_KEY') and os.getenv('KIS_APP_SECRET'), 'KIS repository secrets are missing'"
      - name: Collect full equity universe and generate report
        run: python -m bankis_scout.pipeline --collect
        env:
          KIS_ENV: vps
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      - name: Verify and prepare authenticated artifact
        run: python -m bankis_scout.cloud_delivery prepare
      - name: Store market data and reports
        id: report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bankis-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-export/
          if-no-files-found: error
          retention-days: 3
      - name: Publish latest delivery metadata
        run: python -m bankis_scout.cloud_delivery ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT_ID: ${{ steps.report.outputs.artifact-id }}
      - name: Mark failed execution without using an old report
        if: failure()
        run: python -m bankis_scout.cloud_delivery failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
