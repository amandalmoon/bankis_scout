# Replace hostname and certificate paths after obtaining a domain and TLS certificate.
server {
    listen 443 ssl;
    server_name REPORT_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/REPORT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPORT_DOMAIN/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
